[buildout]
extends =
    https://dist.plone.org/release/6.2-latest/versions.cfg
    base.cfg

# plone.formwidget.geolocation has a release for Plone 6.2: no checkout
auto-checkout =

[instance]
zodb-temporary-storage = off

[versions]
# Releases that no longer use pkg_resources (setuptools 84 has none)
eea.facetednavigation = 16.5
collective.geolocationbehavior = 2.0.0
plone.formwidget.geolocation = 3.0.7
plone.patternslib = 9.11.1
z3c.jbot = 3.1
i18ndude = 6.3.0
